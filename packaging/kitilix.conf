# Kitilix defaults, applied before the user's kitty.conf.
background #151c24
foreground #e5eef4
cursor #77dfd1
selection_background #3a5f6a
selection_foreground #ffffff
font_size 11.0
initial_window_width 960
initial_window_height 640
window_padding_width 5
window_border_width 1pt
window_drag_tolerance 5
active_border_color #62bcb2
inactive_border_color #344350
window_title_bar top
window_title_bar_min_windows 2
window_title_bar_align left
window_title_bar_active_foreground #e5eef4
window_title_bar_active_background #2b434b
window_title_bar_inactive_foreground #a9bdc9
window_title_bar_inactive_background #222d38
tab_bar_background #222b35
tab_bar_margin_color #222b35
tab_separator " │ "
active_tab_foreground #eefffd
active_tab_background #35585c
inactive_tab_foreground #b5c7d0
inactive_tab_background #25313d
tab_title_template " {index}  {title} "
tab_title_max_length 24
update_check_interval 0
map ctrl+shift+enter launch --cwd=current --location=vsplit
map ctrl+shift+minus launch --cwd=current --location=hsplit
map ctrl+shift+f11 toggle_layout stack
